[package]
name = "unread"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Code coverage for human eyes: how much of your codebase was written by an agent and never seen by a person."
license = "MIT"
readme = "README.md"
repository = "https://github.com/tannerfaust/unread"
keywords = ["ai", "agents", "git", "code-review", "coverage"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github"]

[dependencies]
aho-corasick = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
memchr = "2"
memmap2 = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
